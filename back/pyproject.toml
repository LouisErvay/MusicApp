[project]
name = "back"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "pydantic",
    "python-dotenv",
    "njl-fastapi-files",
]

[tool.uv.sources]
njl-fastapi-files = { git = "ssh://git@github.com/LouisErvay/monorepo.git", subdirectory = "packages/fastapi-files", rev = "v0.1.0" }
